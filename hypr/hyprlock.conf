background {
    monitor =
    path = /home/alessandro/Pictures/wallpapers/wallpaper.png
    blur_passes = 3
    blur_size = 8
    brightness = 0.5
}

# Time
label {
    monitor =
    text = $TIME
    color = rgba(200, 200, 200, 1.0)
    font_size = 95
    font_family = SF Pro Display Bold
    position = 0, 150
    halign = center
    valign = center
}

# Date
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    color = rgba(200, 200, 200, 0.7)
    font_size = 20
    font_family = SF Pro Display Bold
    position = 0, 60
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 270, 36
    outline_thickness = 1
    outer_color = rgba(255, 255, 255, 0.2)
    inner_color = rgba(0, 0, 0, 0.35)
    font_color = rgba(255, 255, 255, 1.0)
    font_family = SF Pro Display Light
    dots_size = 0.22
    dots_spacing = 0.28
    dots_center = true
    fade_on_empty = true
    placeholder_text = <span foreground="##ffffff44">password</span>
    rounding = 0
    check_color = rgba(255, 255, 255, 0.35)
    fail_color = rgba(210, 40, 40, 0.85)
    fail_text = <span foreground="##cc2222">access denied</span>
    capslock_color = rgba(255, 190, 0, 0.7)
    position = 0, -90
    halign = center
    valign = center
}
